# ── 本地修改(2026-10-03)────────────────────────────────────────────
# 删除了 cangjie / cangjie_lookup / reverse_lookup 三段。
#
# 原因:它们引用 `dictionary: cangjie5`,而 assets 里**没有** cangjie5.dict.yaml
# 词典文件打不开就会让部署失败 —— 症状不是报错,而是**一个候选都查不出来**,
# 极难定位。
#
# 这个 schema 本身来自 librime 的 data/minimal/,改动**不要在上游更新时直接覆盖**:
# 上游若改了拼音部分,合并这一段即可;若上游不再需要 cangjie,反过来删掉这段注释。
# 另:schema_id 是 `luna_pinyin`(不是 `_simp`),它本身即输出简体,符合只做简体。
# ──────────────────────────────────────────────────────────────────────

# Rime schema
# encoding: utf-8

schema:
  schema_id: luna_pinyin
  name: 朙月拼音
  version: "0.15.test"
  author:
    - 佛振 <chen.sst@gmail.com>
  description: |
    Rime 預設的拼音輸入方案。
    參考以下作品而創作：
      * CC-CEDICT
      * Android open source project
      * Chewing - 新酷音
      * opencc - 開放中文轉換

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, ABC ]
    abbrev: [ 中, Ａ ]
  - name: full_shape
    states: [ 半寬文字, 全寬文字 ]
#  - name: simplification
#    states: [ 傳統漢字, 简化字 ]
#    abbrev: [ 繁, 简 ]
  - options: [ zh_trad, zh_simp, zh_hk, zh_tw ]
    states:
      - 傳統漢字
      - 简化字
      - 香港字形
      - 臺灣字形
    abbrev: [ 繁, 简, 港, 臺 ]
  - name: ascii_punct
    states: [ 中文標點, 西文標點 ]
    abbrev: [ '。', '．' ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@alphabet
    - affix_segmentor@pinyin
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - script_translator
    - script_translator@pinyin
  filters:
    - simplifier@zh_simp
    - simplifier@zh_tw
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^xx$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ve$/$1ue/correction
    - derive/^([jqxy])u/$1v/correction
    - derive/un$/uen/correction
    - derive/ui$/uei/correction
    - derive/iu$/iou/correction
    - derive/([aeiou])ng$/$1gn/correction
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/correction
    - derive/ong$/on/correction
    - derive/ao$/oa/correction
    - derive/([iu])a(o|ng?)$/a$1$2/correction

translator:
  dictionary: luna_pinyin
  preedit_format:
    - xform/([nljqxy])v/$1ü/

alphabet:
  tag: alphabet
  prefix: ':'
  suffix: ';'
  tips: 〔西文〕
  closing_tips: 〔中文〕


pinyin:
  tag: pinyin
  dictionary: luna_pinyin
  enable_user_dict: false
  prefix: 'P:'
  suffix: ';'
  tips: 〔拼音〕
  preedit_format:
    - xform/([nl])v/$1ü/



zh_simp:
  option_name: zh_simp
  tips: all

zh_tw:
  option_name: zh_tw
  opencc_config: t2tw.json

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    alphabet: '(?<![A-Z]):[^;]*;?$'
    pinyin: "P:[a-z']*;?$"
    reverse_lookup: "`[a-z]*'?$"
