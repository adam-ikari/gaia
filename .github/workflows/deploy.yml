name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ---------------------------------------------------------------- APK 镜像
      # 把本仓库最新 release 的正式包取到 docs/public/media/,让 VitePress 拷进产物。
      #
      # ## 为什么不让站点直接链 GitHub 的 release 下载链接
      #
      # 原来链的是 `github.com/<repo>/releases/latest/download/app-release.apk`,
      # 那条链要跳两次:github.com →(302)release-assets.githubusercontent.com →(200)。
      # 在 Titan 2 的浏览器上点它,直接落到 Chrome 的
      # 「网页可能暂时无法连接,或者它已永久性地移动到了新网址」错误页 —— 真机上复现,
      # 同一台机器 curl 却是 200。跨域 + 两跳 + 那个域默认 HTTP/3,是手机浏览器最容易
      # 处理失败的一种下载形态。
      #
      # 改成由 Pages 自己发这个文件后:同源、一次 200、零跳转,走 Pages 的 CDN。
      #
      # ## URL 固定,文件名带版本
      #
      # 落盘名固定叫 `gaia.apk` —— 站点链接 `/media/gaia.apk` 因此**永远指向最新版**,
      # 发版不用改任何 md。而用户存下来的文件名是 `gaia-ime-v<版本>.apk`,
      # 由 `<a download>` 给出(见 `docs/.vitepress/download.ts`)。
      # 为什么不把版本塞进 URL:那就要每发一版改一次 index.md,漏改就 404 或下不到新版。
      #
      # ## 为什么不需要任何 secret
      #
      # 这个 job 跑在**本仓库**里,内置的 GITHUB_TOKEN 对本仓库的 release 有读权限 ——
      # 不需要跨仓库 PAT(应用仓库那个 WEB_RELEASE_TOKEN 在这里用不上)。
      #
      # ## 为什么不把 APK 提交进 git
      #
      # 6.2MB 一份,每次发版都进历史,仓库很快就几十 MB。放进 public/ 但只在 CI 里写,
      # git 完全看不见它。
      # ---------------------------------------------------------------- 三条渠道
      #
      # stable / beta / dev 三份字节,落到三个**固定**路径上。文件名(用户存下来的
      # 那个)带渠道与身份,URL 不带 —— 见 `docs/.vitepress/download.ts` 的注释。
      #
      # ## 致命性不对称,这是这一段最要紧的一行
      #
      # stable **致命**,beta/dev **非致命**。
      #
      # 照抄 stable 那句 `test -s ... || exit 1` 给 beta/dev 的话,
      # 「还没发过 beta」就会让整个部署失败 ⇒ **正式版也更新不了、站点停在上一次**。
      # 一个可选功能能弄挂生产,这是最坏的形状。
      #
      # 代价对称性决定方向:缺 stable 是**发布流程断了**(该 fail);
      # 缺 beta 只是「这个渠道还没上线」(不该 fail)。
      - name: 取三条渠道的 APK 放进 public
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p docs/public/media
          R="$GITHUB_REPOSITORY"

          # ---- stable:最新的正式 release(latest 不含 prerelease)----
          tag=$(gh release view --repo "$R" --json tagName -q .tagName)
          echo "stable: $tag"
          gh release download "$tag" --repo "$R" -p app-release.apk -D docs/public/media
          mv docs/public/media/app-release.apk docs/public/media/gaia.apk
          test -s docs/public/media/gaia.apk || {
            echo "::error::stable APK 没取到 —— 发布流程断了,这是致命的"; exit 1; }
          # **tag 带 v,文件名里不带**:`v0.7.11` → `0.7.11`
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

          # ---- 取一个可选渠道;取不到只 warning,不算失败 ----
          #
          # `$2` = **release 引用**(tag),`$3` = 资产名前缀,`$4` = 落地路径,
          # `$5` = 输出的变量名前缀。
          #
          # ## release 引用必须**显式传**,不能用 latest
          #
          # 2026-10-06 实测踩到:第一版签名里没有它,函数体用
          # `gh release view "$R"`(不带 tag = **latest**)。而 dev 的资产在
          # `dev-latest` 里,`dev-latest` 又是 prerelease ⇒ latest 指向 `v0.7.10`
          # ⇒ 在 v0.7.10 里找 `app-dev-*` 找不到 ⇒ **dev 渠道静悄悄没上线**,
          # 日志里只有一行 warning,而站点部署是 success。
          #
          # 这个 bug 之所以难发现,正因为它**非致命**:降级逻辑按设计工作,
          # 「少一个渠道」被当成「这个渠道还没上线」。
          # ⇒ 三条渠道的 release 引用一律显式传,不留「默认取 latest」这条捷径。
          #
          # **身份(hash)从资产名读**,不从 tag 推导 —— 资产名是「远端确实存着
          # 什么」,是这件事的权威。改成从 tag 推导就会多出一个可能漂移的来源,
          # 不一致的表现是「文件名说 A、装完设置页写 B」。
          take_optional() {
            local label=$1 ref=$2 prefix=$3 dest=$4 var=$5
            local asset ver
            asset=$(gh release view "$ref" --json assets -q \
              "[.assets[].name | select(startswith(\"$prefix\"))] | last // \"\"" 2>/dev/null || true)
            if [ -z "$asset" ]; then
              echo "::warning::$label 没有找到 $prefix* 资产,这个渠道本次不上线"
              return 0
            fi
            ver="${asset#$prefix-}"; ver="${ver%.apk}"
            if [ -z "$ver" ]; then
              echo "::warning::$label($ref) 资产名 $asset 里解析不出身份,跳过(总比给出错的强)"
              return 0
            fi
            if ! gh release download "$ref" -p "$asset" -D docs/public/media; then
              echo "::warning::$label($ref) 下载 $asset 失败,这个渠道本次不上线"
              rm -f "docs/public/media/$asset"
              return 0
            fi
            mv "docs/public/media/$asset" "$dest"
            if [ ! -s "$dest" ]; then
              echo "::warning::$label 落地后 $dest 是空的,这个渠道本次不上线"
              rm -f "$dest"; return 0
            fi
            echo "$var=$ver" >> "$GITHUB_OUTPUT"
            echo "has_${var}=1" >> "$GITHUB_OUTPUT"
            echo "$label: $asset → $dest (身份 $ver)"
          }

          # ---- beta:挑一个**真的含有 app-beta-* 资产**的 prerelease ----
          #
          # ## dev 为什么必须是 prerelease
          #
          # **`dev-latest` 一旦不是 prerelease,GitHub 就把它当成 latest** ——
          # 2026-10-06 实测踩到过:stable 那步于是去 `dev-latest` 里找
          # `app-release.apk`,`gh release download` 回
          # `no assets match the file pattern` ⇒ 部署失败
          # ⇒ **正式版下载按钮整个挂掉**。
          # GitHub 的 latest 明确不含 prerelease,标记 prerelease 就切断了这条 hijack。
          #
          # ## 于是 beta 不能按「最新的 prerelease」挑
          #
          # 因为 dev 也是 prerelease,「最新 prerelease」可能就是 `dev-latest`。
          # 判据改成「这个 release 的资产里有没有 `app-beta-*`」——
          # **按内容挑,不按命名约定挑**。这样 beta 与 dev 谁新谁旧都不影响,
          # 将来多了第四个 prerelease 渠道也不会选错。
          beta_tag=$(gh api "repos/$R/releases" --paginate --jq \
            '[.[] | select(.prerelease == true)
                | {tag: .tag_name,
                   hasBeta: ([.assets[].name | select(startswith("app-beta-"))] | length > 0)}]
             | map(select(.hasBeta)) | first | .tag // ""' 2>/dev/null || true)
          if [ -z "$beta_tag" ]; then
            echo "::warning::还没有含 app-beta-* 的 prerelease,测试版本次不上线"
          else
            echo "beta: $beta_tag"
            take_optional "beta" "$beta_tag" "app-beta" \
              "docs/public/media/gaia-beta.apk" "BETA_VERSION"
          fi

          # ---- dev:固定 tag 的滚动 release ----
          # dev **不是发布**,它没有版本号(应用仓那边刻意不给语义版本),
          # 所以每次 master 构建都发一个 release 是刷屏 + 语义撒谎。
          # ⇒ 固定 tag `dev-latest`,资产 `--clobber` 覆盖,历史靠 git。
          take_optional "dev" "dev-latest" "app-dev" \
            "docs/public/media/gaia-dev.apk" "DEV_VERSION"

          ls -la docs/public/media/

      - name: Build site
        env:
          # 构建期注入,`download.ts` 读它拼出 `gaia-ime-v<版本>.apk`
          VITE_APP_VERSION: ${{ steps.apk.outputs.version }}
          # beta/dev 的身份,取自**资产名**(见上面 take_optional 的注释)。
          # `has_*` 决定按钮渲不渲染 —— 取不到就是空,`download.ts` 那个
          # `usable()` 判据会把空串挡掉,不会拼出 `gaia-ime-beta-.apk`。
          VITE_BETA_VERSION: ${{ steps.apk.outputs.BETA_VERSION }}
          VITE_HAS_BETA: ${{ steps.apk.outputs.has_BETA_VERSION }}
          VITE_DEV_VERSION: ${{ steps.apk.outputs.DEV_VERSION }}
          VITE_HAS_DEV: ${{ steps.apk.outputs.has_DEV_VERSION }}
        run: npm run build

      - name: 产物里必须有 stable APK
        run: |
          test -s docs/.vitepress/dist/media/gaia.apk || {
            echo "::error::构建产物里没有 media/gaia.apk,下载链接会 404"; exit 1; }
          ls -la docs/.vitepress/dist/media/
          # beta/dev 在 dist 里有没有,都**不致命** —— 它们本来就可能没上线。
          # 这里只报事实,让「按钮指向 404」这件事在 run 日志里看得见。
          for f in gaia-beta.apk gaia-dev.apk; do
            if [ -s "docs/.vitepress/dist/media/$f" ]; then
              echo "  有 $f"
            else
              echo "  无 $f(该渠道本次未上线,对应按钮不渲染)"
            fi
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
