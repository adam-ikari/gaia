name: Deploy site

# ## 这个仓里没有站点源码
#
# 站点源码与构建在私有仓 `adam-ikari/hwkbd_ime` 的 `web/`,由那里的
# `tools/release/publish-site.sh` 构建并把**产物**推进本仓的 `main`。
#
# 所以这个 workflow **不跑 npm、不构建** —— 它只做两件事:
#   1. 验产物自洽(下面「验什么」)
#   2. 把产物原样交给 Pages
#
# ## 为什么要保留这个 workflow,而不是让 Pages 直接从 main 分支发布
#
# (2026-10-08 的一个来回:先改成从分支直接发布,又改回来。理由如下。)
#
# 从分支发布**能工作**,但它有两个坏处:
#
# 1. **构建失败只有推的人看得见,而且看的地方很远。** Pages 从分支发布时,
#    构建失败只写在仓库的 Pages 设置页里,不在任何一次 workflow run 上 ——
#    于是「推了但站点没更新」和「推了且站点更新了」在 git 历史里长得**一模一样**。
# 2. **没有地方放产物自洽的检查。** 检查要么塞回应用仓的脚本(那就回到
#    「推之前验、失败只在本地可见」),要么就没了。
#
# 而这个仓里的 workflow 拿的是**本仓 GITHUB_TOKEN**,不需要任何 secret ——
# 这正是它当年能一直存在的原因:产物是提交进来的,不需要凭据去别处取。
#
# ⇒ 保留 workflow:它不构建,但它是「这次推送到底有没有把站点更新掉」的
# **可见记录**,以及产物自洽的落点。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# **cancel-in-progress: false** —— 不打断进行中的部署。
# Pages 一次只接受一个部署;打断会让中间那次白跑,而日志上留下两个
# 「cancelled」和一个 success,看起来像 flaky。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # ======================================================================
      # 验什么,以及为什么不验什么
      #
      # ## 「缺」与「坏」是两件事,致命性不同
      #
      # **缺**可选渠道 —— 不 fatal。与 `publish-site.sh` 里同一条规则:
      # 「还没发过 beta」只是一个渠道没上线,不该让**主渠道也更新不了**,
      # 于是站点停在上一次。一个可选功能能弄挂生产,这是最坏的形状。
      #
      # **坏**(存在但截断/不完整)—— **fatal,三条渠道一视同仁**。
      # 这里的不对称不是按渠道重要性分的,是按「这字节要不要发出去」分的:
      # 我们**明知**有一份坏字节要发布却让它上线,用户点开发版下载只会得到
      # 「软件包无效」—— 正是 2026-10-06 那次报障的症状。
      # 而「缺」的时候页面上根本没有那个按钮(可用性由构建期 flag 决定),
      # 不存在「点到一个坏包」这种可能。
      #
      # ⇒ 判据不是「这条渠道重不重要」,是「我们是否明知故犯地发一份坏字节」。
      #
      # ## 为什么不验「sha256 与远端 release 一致」
      #
      # 因为那件事**已经在推之前验过了**,而且验的是更有权威的东西:
      # 公开站点上那份与本地产物逐字节一致(`publish-site.sh` 最后一步)。
      # 在这里再验一遍 release 的资产,验的是同一件事的一个**副本**,
      # 而且这个仓的 GITHUB_TOKEN 读不到私有仓的 release。
      #
      # ⇒ 这里只验**产物内部的自洽**:页面承诺的与产物实际发的是同一份字节。
      - name: 验产物
        run: |
          set -uo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # ---- 主渠道:缺了就致命 ----
          [ -s dist/index.html ] || fail "dist/index.html 不存在或为空 —— 站点会是一片空白"
          [ -s dist/media/gaia.apk ] || fail "dist/media/gaia.apk 不存在 —— 主下载按钮会 404"
          echo "✓ 主渠道 APK 在产物里($(stat -c%s dist/media/gaia.apk) 字节)"

          # ---- 每条渠道:是完整的 APK,不是下载截断的半截 ----
          #
          # ## 为什么必须验这个
          # 2026-10-06 用户从站点下到装不上的包,安装器只给一句「软件包无效」。
          # 查下来线上那份是好的 —— 是**这个网络下下载会静默截断**。
          #
          # 而截断的 APK 有个特点:`unzip -l` 照样能列出前面一部分条目,
          # 所以「清单里有 AndroidManifest.xml」这种检查**会漏掉它**。
          # 实测:3MB/6.6MB 的截断包里关键条目数是 **0**
          # (zip 的中央目录在文件末尾,截断后整个没了)⇒ 这条抓得住。
          # 退出码也要看:截断包 `unzip -t` 回 **9**,完好的回 0。
          #
          # ## 清单必须**先落文件再 grep**,不能 `unzip -l | grep -q`
          #
          # `grep -q` 找到第一个匹配就退出 ⇒ 上游 `unzip` 收到 SIGPIPE(141)。
          # 而这个 step 开着 `pipefail` ⇒ **整条管道的退出码变成 141**,
          # 于是「清单里有 AndroidManifest.xml」被判成「没有」。
          #
          # 实测(2026-10-08 本地跑真实产物):完好的 6.6MB APK 报
          #   ::error::gaia.apk 里没有 AndroidManifest.xml
          # 而直接 `grep AndroidManifest` 那份清单看得到那个条目。
          #
          # 这是最坏的一类 bug:**闸门对正确的东西报失败**。
          # 人只会绕过它或关掉它 —— 于是真正该拦的截断包也跟着过去。
          # ⇒ 一次落盘,再 grep 文件:退出码归 grep,不会牵连 unzip。
          for f in dist/media/*.apk; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            if ! unzip -tqq "$f" >/dev/null 2>&1; then
              fail "$name 不是完整的 APK(unzip 校验失败)—— 用户会看到「软件包无效」"
            fi
            unzip -l "$f" > /tmp/apk-list.txt 2>/dev/null
            if ! grep -q 'AndroidManifest\.xml' /tmp/apk-list.txt; then
              fail "$name 里没有 AndroidManifest.xml —— 它不是个能装的 APK"
            fi
            if ! grep -qE 'classes[0-9]*\.dex' /tmp/apk-list.txt; then
              fail "$name 里没有 dex —— 它不是个能装的 APK"
            fi
            rm -f /tmp/apk-list.txt
            echo "✓ $name 是完整的 APK($(stat -c%s "$f") 字节)"
          done

          # ---- 页面上给用户的 sha256 必须真的对应产物里的字节 ----
          #
          # ## 判据是**前缀**,不是相等
          # `download.ts` 的 `shortHash()` 只显示 8 位一组的前 **4 组 = 32 位**,
          # 剩下 32 位不显示(窄屏上折行的校验值最容易被抄错)。
          # ⇒ 只能比前缀 —— 而前缀相等对「是不是同一份字节」已经足够:
          # 32 位十六进制撞上的可能性可以忽略。
          #
          # 这条检查抓的是**注入值与产物脱节**:构建脚本算的是 A 的 sha,
          # 页面显示的却是 B 的 sha(抄错变量名、复用了上一版的值)。
          # 那时用户会拿页面上那个数去校验自己下的包,对不上,
          # 而唯一合理的动作变成「猜」。
          #
          # ## 必须**收回它的退出码** —— 又一次「报错被吞掉」
          #
          # 这个 step 只开了 `set -uo pipefail`,**没有 `-e`**(上面的
          # `test || fail` 之所以有效,是因为失败路径自己调了 `exit`)。
          # `python3 - <<'PY' … sys.exit(1) … PY` 的非零退出码
          # **不会**让脚本停下 —— 报错行照打,脚本接着跑完,最后 `exit 0`。
          #
          # 实测(2026-10-08 拿真实产物改坏一个 sha 试出来的):
          #   ::error::页面上的校验值 d922fd17e2c8… 不对应产物里任何一个 APK
          #   退出码: 0        ← 闸门说了「错」,部署照样发生
          #
          # 这是最坏的一种失败:**检查看起来在工作,而它没有**。
          # ⇒ `|| exit 1` 显式收回退出码。
          #
          # 顺带:`::error::` 在这里**只是给人看的**,它不改变任何机器行为 ——
          # 只有退出码会。所以退出码是这个 step 的全部判据。
          python3 - <<'PY' || exit 1
          import hashlib, pathlib, re, sys
          html = pathlib.Path("dist/index.html").read_text(encoding="utf8")
          shown = ["".join(m.split()) for m in
                   re.findall(r'gi-verify-sha"[^>]*>\s*([0-9a-f ]+?)\s*</code>', html)]
          apks = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in pathlib.Path("dist/media").glob("*.apk")}
          if not shown:
              print("::error::页面里没有校验值 —— 用户无从判断自己下全了没有")
              sys.exit(1)
          bad = [s for s in shown if not any(v.startswith(s) for v in apks.values())]
          if bad:
              for s in bad:
                  print(f"::error::页面上的校验值 {s[:12]}… 不对应产物里任何一个 APK")
              sys.exit(1)
          for name, v in apks.items():
              if not any(v.startswith(s) for s in shown):
                  print(f"::warning::{name} 在产物里,但页面上没有它的校验值")
          print(f"✓ 页面上的 {len(shown)} 个校验值都能对上产物里的 APK")
          PY

          # ---- 可选渠道:缺了只报事实,不算失败 ----
          for f in dist/media/gaia-beta.apk dist/media/gaia-dev.apk; do
            if [ -s "$f" ]; then echo "✓ 有 $(basename "$f")"
            else echo "::notice::无 $(basename "$f")(该渠道未上线,页面对应按钮不渲染)"; fi
          done

          echo
          echo "产物清单:"; find dist -type f | sort | sed 's/^/  /'

      # ---- 发布 ----
      #
      # **原样上传,不重新构建。** 这个仓里没有 `package.json`,
      # 「构建」在这里无从发生 —— 产物是构建好的事实,不是待办。
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5