name: E2E (模拟器)

# 端到端 + 素材采集。只在模拟器上跑,**不做发布阻断** —— 它有两个用途:
# 一是回归(挂了要知道),二是给站点出截图与录屏(`tools/aitest/shots.mjs`)。
#
# 为什么用 workflow_dispatch 而不是每次 push 都跑:模拟器冷启动到能打字要 1–2 分钟,
# 每次 push 都跑会把 CI 拖成分钟级,而真正的回归价值在"发版前跑一遍"。
#
# ## 这个文件踩过的坑(2026-09-30 连烧六轮才想通,每一轮都以为是模拟器起不来)
#
# **1. 模拟器的生命周期 == 「启动模拟器」这**一个** step。**
#    step 一结束,action 立刻 `emu kill`。日志长这样:
#      Starting emulator → Boot completed in 56010 ms → [group]Terminate Emulator → emu kill
#    所以安装 APK、启用输入法、截图、录屏**必须全在这个 step 内部**,
#    拆到后面的 step,等它们跑起来 `adb devices` 已经空了。
#    `emu kill` 之后的 `libc++abi: terminating` 是收尾噪音,不是启动失败(我误读过一次)。
#
# **2. workflow 的 `script:` 是用 `/usr/bin/sh` 逐行执行的**,不是当脚本文件跑:
#      [command]/usr/bin/sh -c set -u
#      [command]/usr/bin/sh -c for i in $(seq 1 60); do
#      /usr/bin/sh: 1: Syntax error: end of file unexpected (expecting "done")
#    多行 shell 结构必挂,`set -o pipefail` 也会挂(dash 没这选项)。
#    ⇒ `script:` 只有一行 `bash tools/aitest/ci-capture.sh`,逻辑全在那个文件里。
#
# **3. adb 路径与序列号要显式给。** PATH 上的 adb 不保证是 action 用的那个,
#    `adb shell getprop` 会静默无输出,看着像 boot 不完。
#    → ci-capture.sh 里 `ADB_BIN` / `SERIAL` 有默认值,workflow 再显式传一遍。
#
# **4. KVM 权限。** runner 默认没 /dev/kvm 权限,x86_64 模拟器起不来。
#    → 见「打开 KVM 权限」那步。
#
# (顺带:`-gpu swiftshader_indirect` 在 emulator 37 报 "Failed to find ColorBuffer",
#  间接渲染路径已废弃,现在用 `-gpu swiftshader`;`-no-boot-anim` 不能去掉,
#  留着它 boot_completed 迟迟不上报。)
on:
  workflow_dispatch:
    inputs:
      shots:
        description: 采集站点素材(截图 + 录屏)
        type: boolean
        default: true
      scenes:
        description: 跑哪些场景(逗号分隔;留空 = 不跑回归场景)
        type: string
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ---------------------------------------------------------------- 构建
      - name: 单元测试
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: 构建 debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      # ---------------------------------------------------------------- 模拟器
      - name: 打开 KVM 权限
        run: |
          if [ -e /dev/kvm ]; then
            sudo usermod -aG kvm "$USER" 2>/dev/null || echo "usermod 失败(可能已有权限)"
            sudo chown "$USER" /dev/kvm 2>/dev/null || true
            ls -l /dev/kvm
          else
            echo "::error::本机没有 /dev/kvm:runner 是无硬件加速的 VM,x86_64 模拟器跑不起来"
            exit 1
          fi

      # ---- AVD 屏幕 = Titan 2 的网格(1440x1440 @ 320dpi = 576dp 宽)----
      #
      # 为什么非建不可、不能事后 `wm size` 改(2026-10-01 实测踩过):
      # 改 `wm size`/`wm density` 会把系统搞瘫 —— launcher 直接
      # `ArithmeticException: divide by zero` 崩掉,之后 `am start -W` 一直回
      # `LaunchState: UNKNOWN (0)` / `TotalTime: 0`,Activity 根本起不来。
      # 反复 start 也没用(试了 10 轮,180s 全废)。**只能开机前就配好。**
      #
      # 为什么不带 `--device`:带了会往 config.ini 写 `skin.name`/`skin.path`
      # (手机的皮肤),窗口还是手机的形状。要的就是「只有 hw.lcd.*,皮肤按它生成」。
      #
      # 320dpi = 2.5 密度 ⇒ 1440 / 2.5 = 576dp,和 Titan 2 原生宽度一致
      # (用户改过显示大小后是 598dp,那是另一回事,见 brain 的 paging-feel)。
      - name: 建 Titan 2 屏幕的 AVD
        run: |
          set -uo pipefail
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          yes 2>/dev/null | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'system-images;android-34;default;x86_64' >/dev/null
          avdmanager delete avd -n titan2 >/dev/null 2>&1 || true
          # 建失败要当场停:建不出来还往下走,后面会用 action 的默认 AVD,
          # 于是拍出来是手机的屏幕,而**看起来一切正常**。
          echo no | avdmanager create avd -n titan2 -k "system-images;android-34;default;x86_64" --force \
            || { echo "::error::avdmanager create 失败"; avdmanager list avd; exit 1; }
          # 别猜路径:avdmanager 按 ANDROID_AVD_HOME / ANDROID_SDK_HOME 落盘,
          # 猜错就是「文件不存在」,而真正的 AVD 好好地建在别处。
          avdroot="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          avddir="$(find "$avdroot" -maxdepth 1 -type d -name 'titan2.avd' 2>/dev/null | head -1)"
          if [ -z "$avddir" ]; then
            echo "::error::在 $avdroot 下找不到 titan2.avd"
            echo "--- 实际建到哪了:"; find "$HOME/.android" -maxdepth 3 -name 'titan2*' 2>/dev/null || true
            avdmanager list avd || true
            exit 1
          fi
          cfg="$avddir/config.ini"
          {
            echo "hw.lcd.width=1440"
            echo "hw.lcd.height=1440"
            echo "hw.lcd.density=320"
            echo "hw.initialOrientation=portrait"
            echo "hw.keyboard=yes"
            echo "skin.dynamic=yes"
          } >> "$cfg"
          echo "--- 屏幕配置($cfg):"
          grep -E 'hw.lcd|skin' "$cfg"

      # 装 APK、启用输入法、截图录屏全在这**一个** step 里跑完(坑 1)。
      # script 只写一行(坑 2),逻辑在 tools/aitest/ci-capture.sh。
      - name: 启动模拟器 + 准备 + 采集
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # 显式给,别依赖 PATH(坑 3)
          ANDROID_ADB_PATH: /usr/local/lib/android/sdk/platform-tools/adb
          ANDROID_SERIAL: emulator-5554
          SHOOTS: ${{ inputs.shots && '1' || '' }}
          SCENES: ${{ inputs.scenes }}
        with:
          api-level: 34
          arch: x86_64
          # 用上一步建好的 AVD,**别让 action 重建**(重建会按 profile 写回手机的屏幕)
          avd-name: titan2
          force-avd-creation: false
          # runner 默认只给 2 核,AVD 会警告 "will run more smoothly with 4 CPU cores"
          cores: 4
          disable-animations: true
          emulator-boot-timeout: 600
          # 注释见文件头:`swiftshader_indirect` 已废弃,`-no-boot-anim` 不能去掉
          emulator-options: -no-window -no-snapshot -noaudio -gpu swiftshader -no-boot-anim
          # 必填(去掉报 "Input required and not supplied: script"),且只能单行(坑 2)
          script: bash tools/aitest/ci-capture.sh

      # ---------------------------------------------------------------- 产物
      # 模拟器已经没了,这里只搬文件。
      - name: 列出产物
        if: always()
        run: |
          find out -type f 2>/dev/null | head -50 || echo "(没有产物)"

      - name: 上传素材
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: site-media
          path: out/media
          if-no-files-found: warn

      - name: 上传证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: out/
          if-no-files-found: warn
