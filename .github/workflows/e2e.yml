name: E2E (模拟器)

# 端到端 + 素材采集。这个工作流**只在模拟器上跑**,不做发布阻断 ——
# 它有两个用途:一是回归(挂了要知道),二是给站点出截图与录屏(`tools/aitest/shots.mjs`)。
#
# 为什么用 workflow_dispatch 而不是每次 push 都跑:模拟器冷启动到能打字约 3–5 分钟,
# 每次 push 都跑会把 CI 拖成分钟级,而真正的回归价值在"提交前自己跑一遍"与"发版前跑一遍"。
on:
  workflow_dispatch:
    inputs:
      shots:
        description: 采集站点素材(截图 + 录屏)
        type: boolean
        default: true
      scenes:
        description: 跑哪些场景(逗号分隔;留空 = 只跑素材采集)
        type: string
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ---------------------------------------------------------------- 构建
      - name: 单元测试
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: 构建 debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      # ---------------------------------------------------------------- 模拟器
      # API 34 / x86_64:targetSdk 34 就是为它调的,minSdk 26 向上兼容。
      # `disable-animations`:模拟器的动画默认开着,截图会拍到动画中间帧,
      # 站点素材必须是静止帧。
      - name: 启动模拟器
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          script: |
            adb shell input keyevent 82
          disable-animations: true
          disable-snapshot: true
          emulator-options: -no-window -no-snapshot -noaudio -gpu swiftshader_indirect -no-boot-anim

      # ---------------------------------------------------------------- 前置
      # 这一步卡过一次(2026-09-30 首次跑挂了 24 分钟):`set -e` + 轮询里 adb 短暂不可用会直接
      # 抛错退出,而 `set -euo pipefail` 在某些镜像上让 `adb wait-for-device` 也跟着挂住。
      # 现在:不加 set -e(每步显式判错)、轮询限时、每条 adb 都带超时。
      - name: 等待开机 + 启用输入法
        run: |
          set -uo pipefail
          timeout 120 adb wait-for-device || echo "wait-for-device 超时,继续轮询"

          booted=0
          for i in $(seq 1 48); do
            s=$(timeout 15 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n' || true)
            if [ "$s" = "1" ]; then booted=1; break; fi
            sleep 5
          done
          if [ "$booted" != "1" ]; then echo "::error::模拟器未在 4 分钟内报 boot_completed"; exit 1; fi
          echo "boot completed after ${i} polls"

          # 动画全关:截图要静止帧,动画开着会拍到中间态
          timeout 20 adb shell settings put global window_animation_scale 0 || true
          timeout 20 adb shell settings put global transition_animation_scale 0 || true
          timeout 20 adb shell settings put global animator_duration_scale 0 || true

          # 解锁:模拟器可能锁在 keyguard 上,不解锁则输入框拿不到焦点
          timeout 20 adb shell input keyevent 82 || true
          timeout 20 adb shell wm dismiss-keyguard || true

          timeout 300 adb install -r -t app/build/outputs/apk/debug/app-debug.apk || {
            echo "::error::安装失败"; exit 1; }
          timeout 30 adb shell ime enable dev.hwkbd.ime/.service.ImeService || true
          timeout 30 adb shell ime set dev.hwkbd.ime/.service.ImeService || true
          echo "--- 已启用的输入法:"; timeout 30 adb shell ime list -s || true

      - name: 列表场景
        run: node tools/aitest/harness.mjs list

      # ---------------------------------------------------------------- 素材:录屏包住整场
      # 录屏放在**场景之前**启动、之后停止,这样 mp4 里就是完整的一段交互,
      # 而不是"先录一段空屏再录一段操作"。
      # 每条 adb 都带超时:`screenrecord` 在模拟器上偶发不返回,不设上限会把整步挂死。
      - name: 站点素材(截图 + 录屏)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.shots }}
        run: |
          set -uo pipefail
          mkdir -p out/media
          timeout 20 adb shell rm -f /sdcard/e2e.mp4 || true
          # 后台起录屏,--time-limit 是兜底:即使 kill 没成功,到点它自己停
          ( timeout 200 adb shell screenrecord --time-limit 170 --bit-rate 6000000 --size 720x1440 /sdcard/e2e.mp4 ) &
          REC=$!
          sleep 2
          node tools/aitest/shots.mjs out/media/shots || echo "素材脚本有失败项,继续收尾"
          sleep 2
          kill $REC 2>/dev/null || true
          wait $REC 2>/dev/null || true
          timeout 120 adb pull /sdcard/e2e.mp4 out/media/gaia-demo.mp4 || {
            echo "::warning::录屏拉不下来,站点视频这轮不出"; }
          echo "--- 产物:"; ls -la out/media out/media/shots 2>/dev/null || true

      # ---------------------------------------------------------------- 回归场景
      - name: 跑场景
        if: ${{ inputs.scenes != '' }}
        run: |
          set -uo pipefail
          for s in $(echo '${{ inputs.scenes }}' | tr ',' ' '); do
            echo "=== $s"
            timeout 300 node tools/aitest/harness.mjs run "$s" || echo "场景 $s 失败"
          done

      # ---------------------------------------------------------------- 收尾
      - name: 收集产物
        if: always()
        run: |
          set -uo pipefail
          mkdir -p out/evidence
          cp -r tools/aitest/evidence/* out/evidence/ 2>/dev/null || true
          timeout 60 adb logcat -d -b crash > out/crash.log 2>/dev/null || true
          timeout 60 adb logcat -d -s ImeService:* > out/ime.log 2>/dev/null || true
          echo "--- crash 计数"; grep -c FATAL out/crash.log 2>/dev/null || echo 0

      - name: 上传素材
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: site-media
          path: out/media
          if-no-files-found: warn

      - name: 上传证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: out/
          if-no-files-found: warn
