name: E2E (模拟器)

# 端到端 + 素材采集。只在模拟器上跑,**不做发布阻断** —— 它有两个用途:
# 一是回归(挂了要知道),二是给站点出截图与录屏(`tools/aitest/shots.mjs`)。
#
# 为什么用 workflow_dispatch 而不是每次 push 都跑:模拟器冷启动到能打字要 1–2 分钟,
# 每次 push 都跑会把 CI 拖成分钟级,而真正的回归价值在"发版前跑一遍"。
#
# 模拟器的屏幕 = **Titan 2 的网格**(1440x1440 @ 320dpi = 576dp 宽),
# 见下面「手写一个 Titan 2 屏幕的 AVD」那步。
#
# ## 这个文件踩过的坑(都在 2026-09-30 / 10-01,前面几轮都以为是模拟器起不来)
#
# 1. **模拟器的生命周期 == 「启动模拟器」这**一个** step。**
#    step 一结束,action 立刻 `emu kill`。所以安装 APK、启用输入法、截图、录屏
#    **必须全在这个 step 内部**,拆到后面的 step,等它们跑起来 `adb devices` 已经空了。
#    `emu kill` 之后的 `libc++abi: terminating` 是收尾噪音,不是启动失败。
# 2. **workflow 的 `script:` 是用 `/usr/bin/sh` 逐行执行的**,不是当脚本文件跑:
#    多行 shell 结构会报 `Syntax error: end of file unexpected`,
#    `set -o pipefail` 会报 `Illegal option`(dash 没有 pipefail)。
#    ⇒ `script:` 只有一行 `bash tools/aitest/ci-capture.sh`。
# 3. **adb 路径与序列号要显式给。** PATH 上的 adb 不保证是 action 用的那个,
#    `adb shell getprop` 会静默无输出,看着像 boot 不完。
# 4. **KVM 权限。** runner 默认没 /dev/kvm 权限。
# 5. **不能事后 `wm size` / `wm density`。** 改了会把系统搞瘫(launcher
#    `ArithmeticException: divide by zero`,之后 `am start -W` 一直回
#    `LaunchState: UNKNOWN (0)`)。只能开机前配好。
# 6. **`avdmanager` 在这台 runner 上不可靠**:`create avd` 回 rc=0 却什么都没建,
#    `$HOME/.android` 下连 `titan2*` 都没有。它不认 `--sdk_root`(给了就打印用法)。
#    ⇒ AVD 改成手写 —— 它本来就只是两个文本文件。
#
# 顺带:`-gpu swiftshader_indirect` 在 emulator 37 报 "Failed to find ColorBuffer"
# (间接渲染路径已废弃),现在用 `-gpu swiftshader`;`-no-boot-anim` 不能去掉,
# 留着它 boot_completed 迟迟不上报。
on:
  workflow_dispatch:
    inputs:
      shots:
        description: 采集站点素材(截图 + 录屏)
        type: boolean
        default: true
      scenes:
        description: 跑哪些场景(逗号分隔;留空 = 不跑回归场景)
        type: string
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ---------------------------------------------------------------- 构建
      - name: 单元测试
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: 构建 debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      # ---------------------------------------------------------------- 模拟器
      - name: 打开 KVM 权限
        run: |
          if [ -e /dev/kvm ]; then
            sudo usermod -aG kvm "$USER" 2>/dev/null || echo "usermod 失败(可能已有权限)"
            sudo chown "$USER" /dev/kvm 2>/dev/null || true
            ls -l /dev/kvm
          else
            echo "::error::本机没有 /dev/kvm:runner 是无硬件加速的 VM,x86_64 模拟器跑不起来"
            exit 1
          fi

      # ---- 手写一个 Titan 2 屏幕的 AVD ----
      #
      # AVD 就是两个文本文件:`<name>.ini`(指针)+ `<name>.avd/config.ini`。
      # 之所以手写而不用 `avdmanager`:
      #   - 它在 runner 上回 rc=0 却什么都没建(见文件头坑 6);
      #   - 它不认 `--sdk_root`。
      # 用它反而更可控:屏幕尺寸就是要改的那几个 `hw.lcd.*`。
      #
      # **1440x1440 @ 320dpi**:320dpi = 2.5 密度,1440 / 2.5 = 576dp,
      # 和 Titan 2 原生宽度一致(用户改过显示大小后是 598dp,那是另一回事,
      # 见 brain 的 paging-feel)。
      #
      # 中区宽度跟着变:状态行中区 = 屏宽 − 2 × bar_side_box − 12dp。
      # 手机(1080dp 屏)上只有 159dp,Titan 2 上是 346dp —— 差一倍多,
      # L4 一行装得下几把键、哪些要溢出到 L5 全都不一样。**按手机的宽度拍,版式就是错的。**
      - name: 手写一个 Titan 2 屏幕的 AVD
        run: |
          set -uo pipefail
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          export ANDROID_SDK_ROOT ANDROID_HOME="$ANDROID_SDK_ROOT"
          yes 2>/dev/null | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'system-images;android-34;default;x86_64' >/dev/null

          img="$ANDROID_SDK_ROOT/system-images/android-34/default/x86_64"
          if [ ! -d "$img" ]; then
            echo "::error::系统镜像没装上:$img 不存在"
            exit 1
          fi

          avdhome="$HOME/.android/avd"
          rm -rf "$avdhome/titan2.avd" "$avdhome/titan2.ini"
          mkdir -p "$avdhome/titan2.avd"

          cat > "$avdhome/titan2.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$avdhome/titan2.avd
          path.rel=avd/titan2.avd
          target=android-34
          EOF

          cat > "$avdhome/titan2.avd/config.ini" <<'EOF'
          avd.ini.encoding=UTF-8
          AvdId=titan2
          abi.type=x86_64
          tag.id=default
          tag.display=Default Android System Image
          image.sysdir.1=system-images/android-34/default/x86_64/
          hw.cpu.arch=x86_64
          hw.cpu.ncore=4
          hw.ramSize=2048
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader
          hw.keyboard=yes
          hw.lcd.width=1440
          hw.lcd.height=1440
          hw.lcd.density=320
          hw.initialOrientation=portrait
          disk.dataPartition.size=2G
          skin.dynamic=yes
          EOF

          echo "--- 屏幕配置:"
          grep -E 'hw.lcd|image.sysdir|skin' "$avdhome/titan2.avd/config.ini"

      # 装 APK、启用输入法、截图录屏全在这**一个** step 里跑完(坑 1)。
      # script 只写一行(坑 2),逻辑在 tools/aitest/ci-capture.sh。
      - name: 启动模拟器 + 准备 + 采集
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # 显式给,别依赖 PATH(坑 3)
          ANDROID_ADB_PATH: /usr/local/lib/android/sdk/platform-tools/adb
          ANDROID_SERIAL: emulator-5554
          SHOOTS: ${{ inputs.shots && '1' || '' }}
          SCENES: ${{ inputs.scenes }}
        with:
          api-level: 34
          arch: x86_64
          # 用上一步手写的 AVD,**别让 action 重建**(重建会写回手机的屏幕)
          avd-name: titan2
          force-avd-creation: false
          # runner 默认只给 2 核,AVD 会警告 "will run more smoothly with 4 CPU cores"
          cores: 4
          disable-animations: true
          emulator-boot-timeout: 600
          # 注释见文件头:`swiftshader_indirect` 已废弃,`-no-boot-anim` 不能去掉
          emulator-options: -no-window -no-snapshot -noaudio -gpu swiftshader -no-boot-anim
          # 必填(去掉报 "Input required and not supplied: script"),且只能单行(坑 2)
          script: bash tools/aitest/ci-capture.sh

      # ---------------------------------------------------------------- 产物
      # 模拟器已经没了,这里只搬文件。
      - name: 列出产物
        if: always()
        run: |
          find out -type f 2>/dev/null | head -50 || echo "(没有产物)"

      - name: 上传素材
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: site-media
          path: out/media
          if-no-files-found: warn

      - name: 上传证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: out/
          if-no-files-found: warn

      # ---------------------------------------------------------------- 推到站点
  # 把 status-row.png 推进站点仓库 `docs/public/media/shots/`。
  #
  # ## 为什么单独一个 job 而不是接在采集后面
  #
  # 采集要**模拟器活着**才有意义(坑 1),推文件不要。两者生命周期不同,
  # 混在一个 step 里意味着"推送失败"会把采集的结论一起搞红,分不清是谁的问题。
  # 中间隔 artifact 传文件。
  #
  # ## 没配 token 就整步跳过,不把流水线搞红
  #
  # 应用仓库是私有的,`adam-ikari/gaia` 是公开的;跨仓库写需要 `WEB_RELEASE_TOKEN`
  # (fine-grained PAT,只授权 `adam-ikari/gaia` 的 Contents: write)。
  # 在这个 token 配好之前,站点那张图会一直是上一版 —— 所以要在这里喊一声,
  # 而不是让人对着"CI 全绿但图没更新"猜原因。
  publish-media:
    needs: e2e
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.shots }}
    runs-on: ubuntu-latest
    env:
      # 没配就是空串,下面的 step 级 if 据此跳过
      WEB_TOKEN: ${{ secrets.WEB_RELEASE_TOKEN }}
      SITE_REPO: adam-ikari/gaia
      SITE_PATH: docs/public/media/shots
    steps:
      - name: 拿素材
        uses: actions/download-artifact@v4
        with:
          name: site-media
          path: media

      - name: 推 status-row 到站点仓库
        # step 级 if 而不是 job 级:job 级 if 会把整个 job 标成 skipped,
        # 看不出"是没配 token"还是"跑挂了"。这里让 job 照常跑完、只跳这一步。
        if: env.WEB_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.WEB_TOKEN }}
        run: |
          test -f media/shots/status-row.png || { echo "::error::素材里没有 status-row.png"; exit 1; }
          identify -format 'status-row.png %wx%h\n' media/shots/status-row.png
          git init -q publish
          cd publish
          git remote add origin "https://x-access-token:${WEB_TOKEN}@github.com/${SITE_REPO}.git"
          git fetch -q --depth 1 origin main
          git checkout -q -b main FETCH_HEAD
          mkdir -p "${SITE_PATH}"
          cp ../media/shots/status-row.png "${SITE_PATH}/status-row.png"
          # **`git add -A` 不能省**:第一次推时 ${SITE_PATH} 是新建目录,全是未跟踪文件,
          # 而 `commit -a` 只暂存**已跟踪**的 —— 少了它就是 "nothing added to commit"
          # 退出码 1,推送永远不执行(Actions 默认 bash -e,这一步会红)。
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "media: 更新状态行截图(E2E 自动采集)"
          git push -q origin HEAD:main

      - name: 提醒没配 token
        if: env.WEB_TOKEN == ''
        run: echo "::warning::没配 WEB_RELEASE_TOKEN,status-row.png 没推到 adam-ikari/gaia —— 站点那张图还是上一版(需要 fine-grained PAT:Contents write on adam-ikari/gaia)"
