name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # librime 是 submodule(C++ 源码 + 六个 vendored deps 的子模块)。
          # 不带这个开关就是空目录,CMake 会在 configure 阶段报"找不到 deps/yaml-cpp"。
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # -----------------------------------------------------------------------------
      # NDK + CMake —— 2026-10-02 起必需(拼音内核换成 librime,要交叉编译 .so)
      #
      # 三样都必须显式装:
      # - **NDK**:编 .so;
      # - **CMake 3.22.1**:AGP 拒绝比自己新的?不,是不装就用系统那个,而 ubuntu runner 上
      #   预装的版本与 AGP 要求的格式不保证一致 ⇒ 版本对不上会在 configure 期报难懂的错;
      # - **Boost 头文件**:librime 用 Boost.Regex 之外的**头文件部分**(signals2 /
      #   unordered_map / crc)。它被改成用 std::regex,所以只要头、不要编库;
      #   但头文件本身构建机上得存在,而 runner 镜像不带。
      #
      # 版本与本机一致(NDK 27.1.12297006):**native 与 CI 编出来的 .so 必须同版本**,
      # 否则同一份 Kotlin 在两端行为不同,最难查。
      - name: Set up Android SDK, NDK and CMake
        run: |
          yes 2>/dev/null | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'ndk;27.1.12297006' 'cmake;3.22.1'
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-dev
          # 1.74 是 librime 的最低要求(其 CMakeLists 里 find_package(Boost 1.74.0)),
          # 装到的比这新也没关系 —— 只用头文件,不链接 boost_regex
          dpkg -s libboost-dev | grep -i '^Version'

      - name: Report NDK / CMake / Boost
        run: |
          echo "ndk    : $(ls $ANDROID_HOME/ndk)"
          echo "cmake  : $(ls $ANDROID_HOME/cmake)"
          echo "boost  : $(grep BOOST_LIB_VERSION /usr/include/boost/version.hpp || echo missing)"

      # 有签名 Secret 时解码 keystore;没有则跳过(release 包未签名)
      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "keystore decoded"
          else
            echo "no signing keystore configured, release APK will be unsigned"
          fi

      # 版本号错就别往下走了(见 docs/versioning.md)
      - name: Check version consistency
        run: tools/release/check-version.sh "${GITHUB_REF_NAME}"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble release APK (signed if keystore present)
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true

      # 产物转交给下面的 publish-site 任务:跨 job 只能靠 artifact 传文件
      - name: 上传 APK 构件
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # 把包同步到公开站点仓库 adam-ikari/gaia 的同名 Release。
  #
  # ## 这个 job 默认什么都不做,而且**退出码是 0**
  #
  # 跨仓库写只能靠 PAT(`WEB_RELEASE_TOKEN`),内置 `GITHUB_TOKEN` 只对本仓库有效。
  # 这个 secret 目前**没有配**,所以下面那步一直 skipped —— 流水线全绿,
  # 但站点上的包还是上一个版本。2026-10-02 就这样让 v0.4.2 和 v0.4.3 都只存在于
  # 私有仓库,站点下载链接停在 v0.4.1,而 CI 全程显示成功。
  #
  # 所以现在多两件事:
  # 1. 没配 token 时打 `::warning::` 说明站点链接不会更新(不是静默跳过);
  # 2. 真正的同步走 `tools/release/sync-apk-to-site.sh`,由发版的人跑一次,
  #    不需要任何 secret、不会过期。配了 token 之后这个 job 才会接手,两条不冲突。
  publish-site:
    needs: release
    runs-on: ubuntu-24.04
    env:
      # 没配这个 secret 就整步跳过,不阻塞发版(所以用 step 级 if 而不是 job 级)
      WEB_TOKEN: ${{ secrets.WEB_RELEASE_TOKEN }}
      SITE_REPO: adam-ikari/gaia
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: apks

      - name: 同步 APK 到站点仓库的同名 Release
        if: env.WEB_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.WEB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 幂等:同名 release 已存在就只覆盖资产,不重建(重建会冲掉已有的说明文字)。
          if gh release view "$TAG" --repo "$SITE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" apks/*.apk --repo "$SITE_REPO" --clobber
          else
            gh release create "$TAG" \
              --repo "$SITE_REPO" \
              --title "Gaia $TAG" \
              --notes "由 hwkbd_ime 的发版流水线自动同步。" \
              apks/app-release.apk#app-release.apk \
              apks/app-debug.apk#app-debug.apk
          fi
          # **同步完要验匿名可下**。不验的话,包在仓库里但 latest 指向别处,
          # 或者传输坏了,流水线照样是绿的 —— 站点访客拿到的是上一次的包。
          code=$(curl -sIL --max-time 120 -o /dev/null -w '%{http_code}' \
            "https://github.com/$SITE_REPO/releases/latest/download/app-release.apk")
          echo "匿名下载 HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::同步后匿名下载不是 200,别当成成功" >&2
            exit 1
          fi

      - name: 没配 token,提醒手动同步
        if: env.WEB_TOKEN == ''
        run: |
          echo "::warning::没配 WEB_RELEASE_TOKEN —— 这个 job 没有同步任何东西,站点下载链接仍指向旧版本。"
          echo "::warning::发版后请跑一次: tools/release/sync-apk-to-site.sh ${{ github.ref_name }}"
