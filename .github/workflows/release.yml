name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # librime 是 submodule(C++ 源码 + 六个 vendored deps 的子模块)。
          # 不带这个开关就是空目录,CMake 会在 configure 阶段报"找不到 deps/yaml-cpp"。
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # -----------------------------------------------------------------------------
      # native 构建的前提 + Android SDK 许可(2026-10-03 起必需:内核换成 librime,
      # 要交叉编译 .so,于是 CI 必须有 NDK / CMake)
      #
      # ## 走过三段弯路,记下来免得再犯
      #
      # 1. 裸调 `sdkmanager` → `command not found`(runner 镜像上不在 PATH);
      # 2. 加 `android-actions/setup-android` → 它内部就会跑一次 sdkmanager,
      #    **许可没接受时它自己就 exit 1**,报的是一屏 SDK Preview 许可条款;
      # 3. 试 `android-actions/accept-android-sdk-licenses` → `Unable to resolve
      #    action ... repository not found`(那个路径不存在)。
      #
      # 最终做法:**不用 setup-android**,只用它之后的一个 run 步骤接受许可 ——
      # 因为 GitHub 的 ubuntu runner **本来就预装了 cmdline-tools**
      # (`/usr/local/lib/android/sdk/cmdline-tools/16.0`),只是不在 PATH。
      #
      # NDK 版本**必须与本机一致**(app/build.gradle.kts 的 ndkVersion):
      # 不同 NDK 编出来的 .so 有差异(运行库版本、C++ 标准库细节),
      # 「本地能跑线上崩」这类问题从 Kotlin 侧看不出来。
      - name: Accept licenses, install NDK and CMake
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          yes 2>/dev/null | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'ndk;27.1.12297006' 'cmake;3.22.1'

      # **不装 boost**。曾经装过,是因为 CMake 里有一段过时的 boost 检查;
      # 那份 librime fork 其实已经把 boost 全替掉了(见 ci.yml 的详细注释)。
      - name: Report NDK / CMake
        run: |
          echo "ndk    : $(ls $ANDROID_HOME/ndk)"
          echo "cmake  : $(ls $ANDROID_HOME/cmake)"
          echo "boost  : 不需要(librime fork 已替成 std::regex / 自带 shim)"

      # 有签名 Secret 时解码 keystore;没有则跳过(release 包未签名)
      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "keystore decoded"
          else
            echo "no signing keystore configured, release APK will be unsigned"
          fi

      # 版本号错就别往下走了(见 docs/versioning.md)
      - name: Check version consistency
        run: tools/release/check-version.sh "${GITHUB_REF_NAME}"

      # ---- 闸门:本地跑的是同一段代码 ------------------------------------
      #
      # 原本这里是三四个各写一遍的 step(版本号 / 单测 / assemble / JNI 闸门),
      # 规则散在 yml 里。改一处漏一处的代价已经付过两次:
      #   · 三条流水线的依赖清单不同步 ⇒ CMake 报「找不到 deps/yaml-cpp」(brain: release-flow)
      #   · JNI 闸门只加在 release.yml ⇒ E2E 结构上看不到 R8 问题(它跑 debug 包)
      #
      # 现在规则集中在 `tools/release/gate.sh`,CI 与本地调同一个入口。
      #
      # **这里刻意不加 `--release`。** 那个开关要求本 commit 引用一次 E2E run,
      # 而 tag 推上来时 commit message 早就写死了 —— CI 里查它等于**稳定误报**,
      # 而会误报的闸门只会被绕过去。E2E 引用是**本地发版前**的检查
      # (`gate.sh --release`,推 tag 之前跑),不是产物闸门。
      # 为什么 E2E 硬接不上:`on: push: tags` 上它与本流水线**并行、无依赖**;
      # job 级 needs 跨不了 workflow,要接就得重构成 reusable workflow,
      # 代价大且丢掉手动 dispatch 入口 —— 而换来的仍不是「产物被验过」,
      # 因为 E2E 装的是 **debug 包,不过 R8**。详见 gate.sh 的 check_e2e_cited。
      - name: 闸门(版本号 + 单测 + 构建 + JNI)
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: tools/release/gate.sh --tag "${GITHUB_REF_NAME}"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true

      # 站点只发**测试版 β 与开发版 dev**(2026-10-23 起),正式版不再同步到公开站点。
      # 这里的 release 资产只服务应用仓库自己的版本记录;站点那条链见
      # tools/release/publish-beta.sh 与 publish-site.sh。
