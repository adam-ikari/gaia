name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        # librime 是 submodule,它的 vendored deps 又是子模块。
        # **不带 submodules 就是空目录**,CMake 在 configure 阶段报
        # 「The source directory .../deps/yaml-cpp does not exist」——
        # 那个报错完全指不到真正的原因(看着像依赖缺失,其实是没 checkout)。
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # assembleDebug 会编 native(librime),所以 NDK / CMake 一个都不能少。
      # 版本与 release.yml 一致,且要与 app/build.gradle.kts 的 ndkVersion 对上。
      #
      # 这里曾漏装。**不需要 boost**(2026-10-03 用户「不需要boost」+ 核实):
      # 那份 librime fork 把 boost 全部替掉了 —— 正则走 `std::regex`,而
      # `starts_with` / `split` / `trim` 这些它自己在 `string_utils.hpp` 里
      # 用 `namespace boost { ... }` 重新实现了一份。源码里唯一剩下的
      # `#include <boost/...>` 在 `plugins/plugins_module.cc`,被
      # `ENABLE_EXTERNAL_PLUGINS`(默认 OFF)挡住,我们也不链它。
      # 曾在这里 `apt-get install libboost-dev`,纯粹是因为一段过时的 CMake 检查,
      # 而那条检查报的是「找不到 boost 头文件」——**指向 CMake 而不是 CI**,多绕一圈。
      - name: Accept licenses, install NDK and CMake
        run: |
          set -uo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          yes 2>/dev/null | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'ndk;27.1.12297006' 'cmake;3.22.1' >/dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
